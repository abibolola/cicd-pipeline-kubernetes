# Headless service: no ClusterIP, DNS resolves straight to pod IPs.
# StatefulSets need this to give each pod a stable DNS name.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: shortener
  labels:
    app: redis
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
